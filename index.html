    <title>Torre de Control - ValueData × Falabella</title>
    <script>
      // Aplica tema antes del primer paint (evita flash). Default: light.
      (function () {
        try {
          var saved = localStorage.getItem('vd-theme');
          if (saved === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
